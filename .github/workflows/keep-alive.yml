# Garde la base Supabase active : l'offre gratuite met en pause un projet sans activité pendant 7 jours.
# Toutes les 2 heures, appelle /api/health/db sur l'API Render, qui exécute une vraie requête SQL.
# Effet secondaire : réveille l'API Render si elle dormait (sans la garder éveillée en continu,
# ce qui consommerait le quota de 750 h/mois partagé par les services gratuits).
#
# ATTENTION : GitHub n'exécute les tâches « schedule » que depuis la branche par défaut du dépôt (main).
# Tant que ce fichier n'est que sur feat/web, seul le lancement manuel (« Run workflow ») fonctionne.
name: Keep-alive base de données

on:
  schedule:
    - cron: "17 */2 * * *" # toutes les 2 h, à la minute 17 (évite le pic de début d'heure chez GitHub)
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Surchargeable dans Settings > Secrets and variables > Actions > Variables : LUNASITE_API_URL
      API_URL: ${{ vars.LUNASITE_API_URL || 'https://lunasite-api.onrender.com' }}
    steps:
      - name: Appel de /api/health/db (avec attente du réveil de Render)
        run: |
          set -euo pipefail
          # Render gratuit : le premier appel peut prendre ~50 s. Jusqu'à 6 essais espacés de 20 s.
          body=$(curl --silent --show-error --fail-with-body \
            --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 \
            "${API_URL%/}/api/health/db")
          echo "Réponse : $body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::La base n'a pas répondu correctement"; exit 1; }
